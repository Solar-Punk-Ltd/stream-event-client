# The viewer: a single-page app, its config.json, the files of the Swarm node that runs in a viewer's browser at
# /weeb-3/, and the gateway at /bee when it is proxied. The three files included from stream-event-client/ are written
# at start by 40-gateway-and-policy.sh from the image's settings.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;

  include /etc/nginx/stream-event-client/headers.conf;

  # Every app route serves the page, and react-router picks the view.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The page names its bundle by content hash, so a browser keeping an old page after a deploy would ask for a bundle
  # that is gone. no-cache lets it keep the page but asks the server first, which costs a 304.
  location = /index.html {
    include /etc/nginx/stream-event-client/headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Mounted at start, and never kept, so a changed setting reaches every page opened after it.
  location = /config.json {
    include /etc/nginx/stream-event-client/headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Named by content hash, so they never change and are kept for a year.
  location /assets/ {
    include /etc/nginx/stream-event-client/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;

    # The font files, which Swarm ID's button frame also loads from its own origin when SWARM_ID_URL is set.
    location ~ \.woff2$ {
      include /etc/nginx/stream-event-client/headers.conf;
      include /etc/nginx/stream-event-client/fonts.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }
  }

  # The root worker the page registers for weeb-3, which loads /weeb-3/service.js. Served from the root, it may control
  # the whole site without any header.
  location = /weeb-3-host.js {
    default_type text/javascript;
    include /etc/nginx/stream-event-client/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # The files of the Swarm node that runs in a viewer's browser, weeb-3. A missing file is a 404, never the page. The
  # page registers its service worker through /weeb-3-host.js. The header on service.js lets a page an earlier version
  # left registering it directly still control the whole site.
  location /weeb-3/ {
    types {
      text/javascript js;
      application/wasm wasm;
    }
    default_type application/octet-stream;
    include /etc/nginx/stream-event-client/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;

    location = /weeb-3/service.js {
      include /etc/nginx/stream-event-client/headers.conf;
      add_header Cache-Control "no-cache" always;
      add_header Service-Worker-Allowed "/" always;
      try_files $uri =404;
    }
  }

  include /etc/nginx/stream-event-client/gateway.conf;
}
