# The viewer: a single-page app, its config.json, the gateway at /bee when it is proxied, and the files of the node in
# the browser at /weeb-3/ when it is offered. The three files included from stream-event-client/ are written at start
# by 40-gateway-and-policy.sh from the image's settings.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/stream-event-client/headers.conf;

  # Every app route serves the page, and react-router picks the view.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The page names its bundle by content hash, so a browser keeping an old page after a deploy would ask for a bundle
  # that is gone. no-cache lets it keep the page but asks the server first, which costs a 304.
  location = /index.html {
    include /etc/nginx/stream-event-client/headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Mounted at start, and never kept, so a changed setting reaches every page opened after it.
  location = /config.json {
    include /etc/nginx/stream-event-client/headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Named by content hash, so they never change and are kept for a year.
  location /assets/ {
    include /etc/nginx/stream-event-client/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  include /etc/nginx/stream-event-client/gateway.conf;
  include /etc/nginx/stream-event-client/weeb3.conf;
}
