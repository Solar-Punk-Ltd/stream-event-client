# The hostile site serves its page with no policy of its own and lets any site fetch it. It is the attacker in the
# kit, so it protects nothing.
server {
  listen 80;
  root /usr/share/nginx/html;
  location / {
    try_files $uri $uri/ /index.html;
    add_header Access-Control-Allow-Origin "*" always;
  }
}
